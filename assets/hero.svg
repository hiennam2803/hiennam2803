<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t"><title id="t">Bìa tạp chí cá nhân: Hiền. Võ Văn Hiền. Tôi tạo ra sản phẩm công nghệ, đôi khi tạo luôn sự cố.</title><defs><radialGradient id="g1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#36D6C5" stop-opacity=".35"/><stop offset="1" stop-color="#36D6C5" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#7C9CFF" stop-opacity=".4"/><stop offset="1" stop-color="#7C9CFF" stop-opacity="0"/></radialGradient>
