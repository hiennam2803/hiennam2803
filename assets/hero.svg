
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title">
  <title id="title">Ấn bản cá nhân - Võ Văn Hiền</title>

  <defs>
    <radialGradient id="g1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0" stop-color="#36D6C5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#36D6C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3">
      <stop offset="0" stop-color="#7C9CFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7C9CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".5" stop-color="#7C9CFF"/>
      <stop offset="1" stop-color="#36D6C5"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#36D6C5"/>
    </linearGradient>

    <pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1000" height="460" rx="24"/>
    </clipPath>

    <path id="ring" d="M0,-118 a118,118 0 1,1 0,236 a118,118 0 1,1 0,-236"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="460" fill="#0D1117"/>
    <rect x=".5" y=".5" width="999" height="459" rx="24" fill="none" stroke="#30363D"/>
    <rect width="1000" height="460" fill="url(#gr)"/>

    <circle cx="180" cy="120" r="260" fill="url(#g1)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
    </circle>

    <circle cx="860" cy="400" r="240" fill="url(#g2)">
      <animate attributeName="cy" values="400;300;400" dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="640" cy="40" r="180" fill="url(#g3)">
      <animate attributeName="r" values="180;220;180" dur="8s" repeatCount="indefinite"/>
    </circle>

    <line x1="60" y1="84" x2="940" y2="84" stroke="#30363D"/>
    <line x1="60" y1="388" x2="940" y2="388" stroke="#30363D"/>

    <!-- Header -->
    <g font-family="Arial, sans-serif" font-size="17" letter-spacing="4" fill="#8B949E">
      <text x="60" y="64">ẤN BẢN CÁ NHÂN</text>
      <text x="940" y="64" text-anchor="end">Nº 01 · 2026</text>
    </g>

    <!-- Main initials: VH -->
    <text
      x="54"
      y="295"
      font-family="Arial, Helvetica, sans-serif"
      font-size="218"
      font-weight="800"
      letter-spacing="-12"
      fill="url(#name)">VH.</text>

    <!-- Full name -->
    <text
      x="64"
      y="352"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25"
      font-weight="700"
      letter-spacing="5"
      fill="#E6EDF3">VÕ VĂN HIỀN</text>

    <!-- Animated circular typography -->
    <g transform="translate(790 236)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="40s"
          repeatCount="indefinite"/>

        <circle r="118" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-dasharray="2 8"/>

        <text
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          fill="#36D6C5">
          <textPath href="#ring" startOffset="0" textLength="728" lengthAdjust="spacing">
            BUILD · BREAK · DEBUG · IMPROVE · BUILD · BREAK · DEBUG · IMPROVE ·
          </textPath>
        </text>
      </g>

      <circle r="62" fill="none" stroke="#30363D"/>
      <circle r="8" fill="#36D6C5">
        <animate attributeName="r" values="6;11;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Slogan -->
    <text
      x="60"
      y="428"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-style="italic"
      fill="#E6EDF3">Tôi tạo ra sản phẩm công nghệ, đôi khi tạo luôn sự cố.</text>

    <!-- Animated underline -->
    <rect x="60" y="440" width="120" height="3" rx="1.5" fill="url(#bar)">
      <animate attributeName="width" values="40;260;40" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Location -->
    <text
      x="940"
      y="428"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      fill="#8B949E"
      text-anchor="end">TP. Hồ Chí Minh</text>
  </g>
</svg>
