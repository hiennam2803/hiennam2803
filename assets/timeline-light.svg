
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title">
  <title id="title">Hành trình: sinh viên CNTT, Salud 2025, WIIS 2026, C.I.R.C.A và VYRON 2026, tiếp theo là Full-stack Developer</title>

  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D4FD8"/>
      <stop offset=".5" stop-color="#3F5FD6"/>
      <stop offset="1" stop-color="#0E8F80"/>
    </linearGradient>

    <clipPath id="c">
      <rect width="1000" height="400" rx="24"/>
    </clipPath>

    <pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6D4FD8" stroke-opacity="0.090"/>
    </pattern>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="400" rx="24" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="999" height="399" rx="24" fill="none" stroke="#D0D7DE"/>
    <rect width="1000" height="400" fill="url(#gr)"/>

    <!-- Main timeline -->
    <line x1="40" y1="200" x2="960" y2="200"
      stroke="url(#l)" stroke-width="3" stroke-linecap="round"/>

    <!-- Moving light -->
    <circle r="6" cy="200" fill="#6D4FD8">
      <animate attributeName="cx" values="40;960" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- 01: Current -->
    <line x1="130" y1="154" x2="130" y2="187"
      stroke="#6D4FD8" stroke-opacity=".5" stroke-dasharray="3 5"/>

    <circle cx="130" cy="200" r="11" fill="#FFFFFF" stroke="#6D4FD8" stroke-width="3"/>
    <circle cx="130" cy="200" r="4" fill="#6D4FD8">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <text x="130" y="78" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17" font-weight="600" letter-spacing="3"
      fill="#6D4FD8">HIỆN TẠI</text>

    <text x="130" y="112" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="21" font-weight="600"
      fill="#1F2328">Sinh viên CNTT</text>

    <text x="130" y="142" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="#59636E">ĐH GTVT TP.HCM</text>

    <!-- 02: Salud -->
    <line x1="315" y1="213" x2="315" y2="230"
      stroke="#0E8F80" stroke-opacity=".5" stroke-dasharray="3 5"/>

    <circle cx="315" cy="200" r="11" fill="#FFFFFF" stroke="#0E8F80" stroke-width="3"/>
    <circle cx="315" cy="200" r="4" fill="#0E8F80">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" begin="-.6s" repeatCount="indefinite"/>
    </circle>

    <text x="315" y="258" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17" font-weight="600" letter-spacing="3"
      fill="#0E8F80">2025</text>

    <text x="315" y="292" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25" font-weight="700"
      fill="#1F2328">Salud</text>

    <text x="315" y="322" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="#59636E">App Android sức khỏe</text>

    <!-- 03: WIIS -->
    <line x1="500" y1="154" x2="500" y2="187"
      stroke="#3F5FD6" stroke-opacity=".5" stroke-dasharray="3 5"/>

    <circle cx="500" cy="200" r="11" fill="#FFFFFF" stroke="#3F5FD6" stroke-width="3"/>
    <circle cx="500" cy="200" r="4" fill="#3F5FD6">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>

    <text x="500" y="78" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17" font-weight="600" letter-spacing="3"
      fill="#3F5FD6">2026</text>

    <text x="500" y="112" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25" font-weight="700"
      fill="#1F2328">WIIS</text>

    <text x="500" y="142" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="#59636E">Lịch học cho sinh viên</text>

    <!-- 04: C.I.R.C.A and VYRON -->
    <line x1="685" y1="213" x2="685" y2="230"
      stroke="#6D4FD8" stroke-opacity=".5" stroke-dasharray="3 5"/>

    <circle cx="685" cy="200" r="11" fill="#FFFFFF" stroke="#6D4FD8" stroke-width="3"/>
    <circle cx="685" cy="200" r="4" fill="#6D4FD8">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>

    <text x="685" y="258" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17" font-weight="600" letter-spacing="3"
      fill="#6D4FD8">2026</text>

    <text x="685" y="292" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="21" font-weight="700"
      fill="#1F2328">C.I.R.C.A · VYRON</text>

    <text x="685" y="322" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="#59636E">Desktop AI · Chrome</text>

    <!-- 05: Next -->
    <line x1="870" y1="154" x2="870" y2="187"
      stroke="#0E8F80" stroke-opacity=".5" stroke-dasharray="3 5"/>

    <circle cx="870" cy="200" r="11" fill="#FFFFFF" stroke="#0E8F80" stroke-width="3"/>
    <circle cx="870" cy="200" r="4" fill="#0E8F80">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" begin="-2.4s" repeatCount="indefinite"/>
    </circle>

    <text x="870" y="78" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17" font-weight="600" letter-spacing="2"
      fill="#0E8F80">TIẾP THEO</text>

    <text x="870" y="112" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25" font-weight="700"
      fill="#1F2328">Full-stack</text>

    <text x="870" y="142" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="#59636E">Developer</text>

  </g>
</svg>
