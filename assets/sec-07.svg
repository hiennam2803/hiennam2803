
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" role="img" aria-labelledby="t">
  <title id="t">Mục 07: Kết nối</title>

  <defs>
    <linearGradient id="u" x1="0" x2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c">
      <rect width="1000" height="120" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="120" rx="20" fill="#0D1117"/>
    <rect x=".5" y=".5" width="999" height="119" rx="20" fill="none" stroke="#30363D"/>

    <text x="36" y="98"
      font-family="Arial, Helvetica, sans-serif"
      font-size="118"
      font-weight="800"
      fill="none"
      stroke="#A78BFA"
      stroke-opacity=".5"
      stroke-width="1.5">07</text>

    <text x="210" y="62"
      font-family="Arial, Helvetica, sans-serif"
      font-size="44"
      font-weight="600"
      fill="#E6EDF3">Kết nối</text>

    <text x="212" y="92"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      font-weight="500"
      letter-spacing="3"
      fill="#8B949E">SAY HELLO</text>

    <rect x="210" y="108" width="200" height="3" rx="1.5" fill="url(#u)">
      <animate attributeName="width" values="60;780;60" dur="7s" repeatCount="indefinite"/>
    </rect>

    <circle cx="950" cy="60" r="7" fill="#A78BFA">
      <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
