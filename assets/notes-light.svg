
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t">
  <title id="t">Góc ghi chú: đang học làm việc với AI, khám phá quản lý ngữ cảnh cục bộ và Electron, đang làm C.I.R.C.A, tiếp theo là Android và Full-stack</title>

  <defs>
    <clipPath id="c">
      <rect width="1000" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="420" rx="24" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="999" height="419" rx="24" fill="none" stroke="#D0D7DE"/>

    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6D4FD8" stroke-opacity="0.063"/>
    </pattern>
    <rect width="1000" height="420" fill="url(#gr)"/>

    <!-- NOTE 01 -->
    <g transform="translate(40 40) rotate(-3 110 130)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0;0 -6;0 0" dur="6s" begin="0s" repeatCount="indefinite"/>

      <rect width="220" height="262" rx="6" fill="#F6F8FA" stroke="#6D4FD8" stroke-opacity=".7"/>
      <rect x="70" y="-12" width="80" height="26" fill="#6D4FD8" fill-opacity=".55" transform="rotate(-2 110 0)"/>

      <text x="22" y="56" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6D4FD8">ĐANG HỌC</text>
      <line x1="22" y1="68" x2="198" y2="68" stroke="#6D4FD8" stroke-opacity=".5" stroke-dasharray="2 5"/>

      <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#1F2328">Làm việc với AI</text>
      <text x="22" y="142" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#1F2328">như một người</text>
      <text x="22" y="176" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#1F2328">cộng sự.</text>
    </g>

    <!-- NOTE 02 -->
    <g transform="translate(270 70) rotate(2 110 130)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0;0 -6;0 0" dur="7s" begin="-1.3s" repeatCount="indefinite"/>

      <rect width="220" height="262" rx="6" fill="#F6F8FA" stroke="#0E8F80" stroke-opacity=".7"/>
      <rect x="70" y="-12" width="80" height="26" fill="#0E8F80" fill-opacity=".55" transform="rotate(-2 110 0)"/>

      <text x="22" y="56" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0E8F80">ĐANG KHÁM PHÁ</text>
      <line x1="22" y1="68" x2="198" y2="68" stroke="#0E8F80" stroke-opacity=".5" stroke-dasharray="2 5"/>

      <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#1F2328">Quản lý ngữ cảnh</text>
      <text x="22" y="142" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#1F2328">cục bộ &amp; ứng dụng</text>
      <text x="22" y="176" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#1F2328">desktop (Electron).</text>
    </g>

    <!-- NOTE 03 -->
    <g transform="translate(500 36) rotate(-2 110 130)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0;0 -6;0 0" dur="8s" begin="-2.6s" repeatCount="indefinite"/>

      <rect width="220" height="262" rx="6" fill="#F6F8FA" stroke="#3F5FD6" stroke-opacity=".7"/>
      <rect x="70" y="-12" width="80" height="26" fill="#3F5FD6" fill-opacity=".55" transform="rotate(-2 110 0)"/>

      <text x="22" y="56" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#3F5FD6">ĐANG LÀM</text>
      <line x1="22" y1="68" x2="198" y2="68" stroke="#3F5FD6" stroke-opacity=".5" stroke-dasharray="2 5"/>

      <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#1F2328">C.I.R.C.A —</text>
      <text x="22" y="142" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#1F2328">không gian làm việc</text>
      <text x="22" y="176" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#1F2328">AI trên desktop.</text>
    </g>

    <!-- NOTE 04 -->
    <g transform="translate(730 66) rotate(3 110 130)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0;0 -6;0 0" dur="9s" begin="-3.9s" repeatCount="indefinite"/>

      <rect width="220" height="262" rx="6" fill="#F5DF72" stroke="#F5DF72" stroke-opacity=".7"/>
      <rect x="70" y="-12" width="80" height="26" fill="#F5DF72" fill-opacity=".55" transform="rotate(-2 110 0)"/>

      <text x="22" y="56" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#7A6A10">TIẾP THEO</text>
      <line x1="22" y1="68" x2="198" y2="68" stroke="#7A6A10" stroke-opacity=".5" stroke-dasharray="2 5"/>

      <text x="22" y="108" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#3B3410">Kiến trúc Android,</text>
      <text x="22" y="142" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#3B3410">rồi Full-stack.</text>
      <text x="22" y="176" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#3B3410">Đích đến rõ rồi.</text>
    </g>

    <text x="40" y="392" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing=".3" fill="#59636E">// ghi chú cập nhật theo những gì mình đang làm</text>
  </g>
</svg>
