
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" role="img" aria-labelledby="title">
  <title id="title">Mục 04: Những thứ tôi đã tạo ra</title>

  <defs>
    <linearGradient id="u" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D4FD8"/>
      <stop offset="1" stop-color="#6D4FD8" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="c">
      <rect width="1000" height="120" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="120" rx="20" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="999" height="119" rx="20" fill="none" stroke="#D0D7DE"/>

    <!-- Section number -->
    <text
      x="36"
      y="98"
      font-family="Arial, Helvetica, sans-serif"
      font-size="118"
      font-weight="800"
      fill="none"
      stroke="#6D4FD8"
      stroke-opacity=".5"
      stroke-width="1.5">04</text>

    <!-- Main title -->
    <text
      x="210"
      y="62"
      font-family="Arial, Helvetica, sans-serif"
      font-size="36"
      font-weight="600"
      fill="#1F2328">Những thứ tôi đã tạo ra</text>

    <!-- Subtitle -->
    <text
      x="212"
      y="92"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      font-weight="500"
      letter-spacing="3"
      fill="#59636E">SELECTED WORKS</text>

    <!-- Animated underline -->
    <rect x="210" y="108" width="200" height="3" rx="1.5" fill="url(#u)">
      <animate
        attributeName="width"
        values="60;780;60"
        dur="7s"
        repeatCount="indefinite"/>
    </rect>

    <!-- Decorative indicator -->
    <circle cx="950" cy="60" r="7" fill="#6D4FD8">
      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
