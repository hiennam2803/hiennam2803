<rect x="28" y="40" width="190" height="10" rx="5" fill="#2A2640"/><rect x="28" y="62" width="140" height="10" rx="5" fill="#2A2640"/><rect x="28" y="84" width="170" height="10" rx="5" fill="#2A2640"/>
