<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-labelledby="t">
<title id="t">Ảnh bìa dự án C.I.R.C.A</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B4A7F5"/><stop offset="1" stop-color="#36D6C5"/></linearGradient>
<radialGradient id="o"><stop offset="0" stop-color="#B4A7F5" stop-opacity=".4"/><stop offset="1" stop-color="#B4A7F5" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#B4A7F5" stroke-opacity=".06"/></pattern>
<clipPath id="c"><rect width="480" height="220" rx="16"/></clipPath>
