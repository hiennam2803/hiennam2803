name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%236D4FD8&color_dots=%23EAEEF2,%23D8CFFA,%23B6A5F5,%238F7BEA,%236D4FD8&color_dot_border=%23FFFFFF
            dist/github-snake-dark.svg?color_snake=%23A78BFA&color_dots=%23161B22,%23283057,%234B5FA8,%237C9CFF,%2336D6C5&color_dot_border=%230D1117

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
